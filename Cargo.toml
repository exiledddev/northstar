[package]
name = "northstar"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "A screenwriting studio for Linux — markdown in, industry format out."
license = "MIT"

[dependencies]
# egui is re-exported by eframe (eframe::egui) so the versions can never drift.
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
dirs = "5"
printpdf = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
