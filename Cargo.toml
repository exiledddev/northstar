[package]
name = "northstar"
version = "2.0.0"
edition = "2021"
rust-version = "1.76"
description = "A screenwriting studio for Linux — markdown in, industry format out."
license = "MIT"
authors = ["MarkedExiled Software"]

[dependencies]
# egui is re-exported by eframe (eframe::egui) so the versions can never drift.
# Pinned to the same release as Tesseract: the two apps share one design system
# and it is drawn with the same toolkit.
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
dirs = "5"
# printpdf 0.7.0, vendored with a two-line fix so it also builds for the browser
# (see vendor/printpdf/VENDORED.md). The desktop build compiles the same code
# it always did. No default features: the only one is a browser clock that
# does not compile in 0.7.
printpdf = { path = "vendor/printpdf", version = "0.7.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Same version eframe pulls in, so the handle traits are the same traits.
raw-window-handle = "0.6"
# std's clocks on the desktop; the browser's clock in the web build, where
# std::time::Instant::now() would panic. egui itself uses the same crate.
web-time = "1.1"

# The web build: the browser's clock for dates, so a snapshot or a new draft
# made in a tab is stamped with the real time. (A PDF's metadata date is left
# at printpdf's epoch default there, which nothing reads.)
[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }

# Compositor blur. Both are optional at runtime: if the session is not the one
# a backend speaks to, it says so and the app falls back to opaque islands.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
